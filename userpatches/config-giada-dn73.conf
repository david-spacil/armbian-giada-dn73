# Build configuration for the Giada DN73.
#
#   ./compile.sh build giada-dn73
#
# Armbian resolves the bare argument to userpatches/config-<argument>.conf
# (lib/functions/cli/utils-cli.sh). Anything passed on the command line still
# wins over what is set here, so one-off variations need no edit:
#
#   ./compile.sh build giada-dn73 BRANCH=edge
#
# Modelled on config/templates/config-example.conf.template.

BOARD=giada-dn73
BRANCH=current          # the only branch that is tested; edge builds but is unverified
RELEASE=trixie
BUILD_DESKTOP=no
BUILD_MINIMAL=no        # keep the CLI utilities
KERNEL_CONFIGURE=no

# The reason this file exists at all.
#
# Stock Armbian's linux-dtb-current-rockchip64 ships 255 device trees and not
# one of them is this board. unattended-upgrades is enabled by default and
# Armbian's own 02-armbian-periodic allows origin=Armbian, so the first time
# apt.armbian.com publishes a version above the locally built one, the Giada
# DTB is replaced by a package that does not contain it, U-Boot stops finding
# fdtfile=rockchip/rk3328-giada-dn73.dtb, and the board silently fails to boot
# with nobody at the keyboard.
#
# BSPFREEZE apt-mark holds every locally built package that was installed into
# the image, from inside the chroot (lib/functions/rootfs/distro-agnostic.sh).
# It is Armbian's own switch, so it cannot miss a package the way a hand-written
# list would. Updating this board means rebuilding from this repository, not
# apt upgrade.
BSPFREEZE=yes

# On build hosts with less than ~6.5 GB of RAM the kernel BTF link step runs out
# of memory. Uncomment, or pass it on the command line.
#KERNEL_BTF=no
